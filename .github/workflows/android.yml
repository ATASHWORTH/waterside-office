name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # run by hand after changing the Office on the Waterside Press site

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The liturgy comes from the site itself, so the app always matches it.
      - uses: actions/checkout@v4
        with:
          repository: atashworth/waterside-press
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the Office page from the site's content
        run: SITE_DIR=site node tools/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DailyOffice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DailyOffice-apk
          path: DailyOffice.apk

      # A release gives a plain download link you can open on your phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DailyOffice.apk \
            --title "Daily Office (build ${{ github.run_number }})" \
            --notes "Tap DailyOffice.apk to download, then open it to install."
